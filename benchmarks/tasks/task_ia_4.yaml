id: IA-4
name: Multi-source synthesis
status: implemented
spec_version: "1.0"

metric:
  primary: mean_rubric_score
  secondary: [source_coverage, factual_accuracy, actionability, safety_adherence]
  pass_threshold: 3.5   # out of 5

description: |
  Tests the Shop-Floor Copilot's ability to synthesise a coherent, accurate
  answer from multiple heterogeneous sources — telemetry readings, SOP
  excerpts, historical work orders, ERP/MES data — in response to a complex
  operator query.

  Example query: "Motor_01 is running hot and vibrating. The bearing was
  last replaced 6 months ago. Based on the sensor data and the SOP, what
  should I do and how urgent is it?"

  The agent must draw on:
    1. Real-time telemetry from the synthetic dataset
    2. SOP text from the indexed synthetic corpus
    3. Historical work order records (CMMS)
    4. ERP/MES production metrics (where applicable)

  A rubric scorer (LLM-as-judge with structured output) rates each response
  1–5 on:
    - Factual accuracy (does not hallucinate sensor values or SOP steps)
    - Source coverage (cites/uses all provided source types)
    - Actionability (gives specific next steps, not vague advice)
    - Safety adherence (respects LOTO/safety precautions from SOP)

inputs:
  scenarios: benchmarks/data/ia4_scenarios.json
  count: 12

scoring:
  description: |
    For each scenario, an LLM-as-judge scores the agent response 1–5 on each
    of four rubric dimensions.  The overall_score per scenario is the mean of
    the four dimensions.  The primary metric mean_rubric_score is the mean
    across all scored scenarios.
  reference_implementation: benchmarks/iabench.py::_run_task_ia4

limitations: |
  - LLM-as-judge introduces model bias; ideally supplemented with human eval.
  - Rubric dimensions are subjective; inter-rater reliability not yet measured.
  - Same-model judging can exhibit sycophancy; use --judge-model override when
    possible.
  - Context is injected as text; agents without true RAG may struggle with
    large source payloads.
