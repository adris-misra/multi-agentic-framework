id: IA-6
name: Token-cost-per-decision
status: implemented
spec_version: "1.0"

metric:
  primary: usd_per_decision
  secondary: [input_tokens_per_decision, output_tokens_per_decision, total_tokens_per_decision, mean_latency_seconds]
  pass_threshold: null   # informational only in v1.0; target TBD after baseline

description: |
  Measures the mean token cost (USD) per agent invocation across a
  representative workload of 10 canonical operator decisions.

  Cost is computed from the provider's token usage fields returned by each
  LLM call:
    - Anthropic: usage.input_tokens, usage.output_tokens
    - OpenAI: usage.prompt_tokens, usage.completion_tokens
    - Ollama: prompt_eval_count / eval_count from chat response; if
      prompt_eval_count is 0 (cached prompt), input tokens are estimated
      from character count / 4 and flagged as "estimated"

  Pricing is looked up from benchmarks/data/llm_pricing.json which maps
  model names to USD-per-1M-token rates.  Ollama models have $0.00 rates
  (local compute cost not captured); for these, mean_tokens_per_decision
  and mean_latency_seconds are the meaningful efficiency proxies.

inputs:
  decisions: benchmarks/data/ia6_decisions.json
  pricing: benchmarks/data/llm_pricing.json
  count: 10

scoring:
  description: |
    For each decision, a _TokenTracker wrapper intercepts the LLM response
    and accumulates input_tokens and output_tokens.  Cost = (input_tokens *
    input_price + output_tokens * output_price) / 1,000,000.
    mean_usd_per_decision is the mean across all scored decisions.

    For local (Ollama) models usd_per_decision will be 0.0 — this is correct
    and is NOT flagged suspicious.  Report mean_tokens_per_decision and
    mean_latency_seconds instead.
  reference_implementation: benchmarks/iabench.py::_run_task_ia6

limitations: |
  - Pricing table (llm_pricing.json) requires manual maintenance as providers
    change rates.
  - Ollama local cost depends on hardware; GPU vs CPU electricity cost is not
    captured.
  - Ollama prompt_eval_count is 0 for cached prompts; input tokens fall back
    to character-count estimation (token_source: "estimated").
  - Multi-hop queries (agent calls multiple LLMs in sequence) sum all hops
    via the _TokenTracker accumulator.
  - Context caching (Anthropic) can reduce real costs below naive calculation.
