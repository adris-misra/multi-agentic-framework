id: IA-7
name: Mean-time-to-escalation appropriateness
status: implemented
spec_version: "1.0"

metric:
  primary: routing_F1
  secondary: [mean_time_to_escalation_ms]
  pass_threshold: 0.80   # routing macro-F1

description: |
  Measures whether the HITL Supervisor routes decisions correctly given a
  confidence score and reversibility class.

  Decision matrix (derived from config/escalation_rules.yaml):
    - auto_proceed: confidence >= 0.85 AND reversibility != irreversible AND zone >= 2
    - escalate:     confidence < 0.85 AND reversibility != irreversible AND zone >= 2
    - block:        reversibility == irreversible OR purdue_zone <= 1

  1. ROUTING QUALITY (primary metric): macro-F1 across three classes
     (auto_proceed / escalate / block) on the 20-case ia7_routing_cases.json corpus.

  2. LATENCY (secondary): mean wall-clock time (ms) from decision-received to
     routing-decision-made, measured for escalated cases only.

  Routing is purely deterministic (config-driven thresholds); no LLM is
  consulted.  routing_F1 == 1.0 is the CORRECT expected result for a
  well-configured deterministic policy — not a red flag.

inputs:
  cases: benchmarks/data/ia7_routing_cases.json
  count: 20   # covers full matrix: high/moderate/low x reversible/soft/irreversible + zone edge cases

scoring:
  description: |
    For each case:
      - Apply routing policy (irreversibility → block, zone 0/1 → block,
        confidence < 0.85 → escalate, otherwise → auto_proceed)
      - For confidence-based cases: route through HITLSupervisorAgent
      - Compare actual vs expected_routing (ground truth from config thresholds)
    macro-F1 = mean(F1_auto_proceed, F1_escalate, F1_block).
    mean_time_to_escalation_ms = mean(latency_ms for escalated cases).
  reference_implementation: benchmarks/iabench.py::_run_task_ia7

limitations: |
  - Routing is deterministic; latency reflects Python overhead only (no network).
  - The 20-case corpus covers the full decision matrix but not novel edge cases.
  - Soft-reversible at high confidence routes to auto_proceed (no config rule blocks it).
