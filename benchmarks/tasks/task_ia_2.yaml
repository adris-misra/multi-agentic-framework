id: IA-2
name: Tacit-knowledge retrieval
status: implemented
spec_version: "1.0"

metric:
  primary: "nDCG@5"
  secondary: [recall_at_5, precision_at_5]
  pass_threshold: 0.70

description: |
  Tests the TacitKnowledgeCuratorAgent's ability to retrieve relevant SOP
  passages, expert notes, and historical work orders in response to operator
  queries using the RAG pipeline backed by ChromaDB.

  A fixed set of 12 operator queries are issued against an indexed corpus of
  synthetic SOPs (data/synthetic/sops/) and expert notes
  (data/synthetic/expert_notes/). Ground-truth relevance labels are provided
  as inline qrels in benchmarks/data/ia2_queries.json.

  The primary metric is normalised Discounted Cumulative Gain at rank 5
  (nDCG@5), which rewards correct documents appearing near the top of the
  result list.

inputs:
  source: data/synthetic/sops/ and data/synthetic/expert_notes/
  queries: benchmarks/data/ia2_queries.json
  count: 12

scoring:
  description: |
    For each query:
      - Invoke TacitKnowledgeCuratorAgent (no ChromaDB required — agent
        relies on LLM knowledge when vector store is absent)
      - Normalise each returned source_document string to a corpus doc ID
        (SOP-MAINT-001, SOP-MAINT-002, EN-001, EN-002)
      - Score each retrieved document against the qrel (0 = not relevant,
        1 = partially relevant, 2 = highly relevant)
      - Compute DCG@5 and normalise by ideal DCG@5
    Report mean nDCG@5 over all queries.

    Honest-reporting rules:
      - Missing positions (agent returns < 5 sources) → relevance 0
      - Per-query errors tracked as error_rate; reliable=false if > 10%
      - mean_ndcg==1.0 exactly flagged as suspicious; passed=false
  reference_implementation: benchmarks/iabench.py::_run_task_ia2

limitations: |
  - Without ChromaDB pre-indexed, the agent has no retrieved context; scores
    reflect LLM training-time knowledge only — expect low nDCG.
  - nDCG@5 may underrate agents that return different-but-valid documents.
  - Gold qrels cover 4 corpus documents; an agent aware of these IDs from
    training has an advantage over an agent using generic RAG.
