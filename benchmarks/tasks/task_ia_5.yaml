id: IA-5
name: Hallucination rate
status: implemented
spec_version: "1.0"

metric:
  primary: hallucination_pct
  secondary: [mean_recall]
  pass_threshold: 0.02   # <= 2% of queries contain hallucinated content

description: |
  Measures the fraction of grounded queries where the agent's response
  contains unsupported or forbidden factual claims.

  A "hallucinated" query is one where the LLM-as-judge detects that the
  agent's response asserts a specific value (number, part number, SOP ID,
  person name) that contradicts the expected key facts or is listed as a
  forbidden fact.

  Example query: "What torque should be applied to the hydraulic filter bowl?"
  Expected: agent returns "35 Nm" (from SOP-MAINT-002 step 9)
  Hallucination: agent returns "25 Nm" or "50 Nm" — plausible but wrong

  18 grounded queries cover facts traceable to the synthetic SOP and expert-
  note corpus. The LLM-as-judge evaluates each response.

inputs:
  source: data/synthetic/sops/ and data/synthetic/expert_notes/
  queries: benchmarks/data/ia5_grounded_queries.json
  count: 18

scoring:
  description: |
    For each query:
      1. Invoke TacitKnowledgeCuratorAgent to get the agent's answer.
      2. Pass question, answer, expected_key_facts, and forbidden_facts to
         the LLM-as-judge.
      3. Judge returns: recall (float), has_hallucination (bool),
         hallucinations_detected (list[str]).
    hallucination_pct = queries_with_hallucination / total_non_error_queries
    mean_recall is reported as a secondary metric.

    Honest-reporting rules:
      - Errors (agent or judge failures) are NOT counted as hallucinations.
      - error_rate tracked separately; reliable=false if > 10%.
      - hallucination_pct==0.0 exactly flagged as suspicious; passed=false.
  reference_implementation: benchmarks/iabench.py::_run_task_ia5

llm_judge:
  description: |
    The judge uses the same LLM provider as the agent under test.
    By default the same model is used for both agent and judge.

    Design trade-off: using the same model as judge has known limitations —
    the judge may share the agent's blind spots and exhibit sycophancy
    (tendency to agree with its own outputs). To mitigate this, pass a
    different model via --judge-model (e.g. a larger or independent model).

    The judge model used in each run is recorded in result details under
    the key judge_model.
  default: same as --model (agent under test)
  override_flag: --judge-model

limitations: |
  - Automated judge may miss hallucinations expressed as paraphrases.
  - Same-model judging can under-detect hallucinations (sycophancy).
  - Does not measure hallucinations in qualitative/procedural statements —
    only specific named/numerical claims.
  - Without ChromaDB the agent cannot cite corpus documents; all answers
    come from LLM training knowledge, increasing hallucination risk.
