name: Bug Report
description: Report a reproducible defect in the framework
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for taking the time to report a bug. Please fill in as much detail as possible.

  - type: textarea
    id: description
    attributes:
      label: Description
      description: A clear, concise description of the bug.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Run `make demo`
        2. Open the operator copilot at http://localhost:8501
        3. Enter "..."
        4. See error
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behaviour
      description: Include full error output / tracebacks.
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Framework version
      placeholder: "e.g. 0.1.0 or git SHA"
    validations:
      required: true

  - type: dropdown
    id: llm_provider
    attributes:
      label: LLM provider
      options: [anthropic, openai, bedrock, ollama, other]
    validations:
      required: false

  - type: textarea
    id: environment
    attributes:
      label: Environment
      placeholder: |
        OS: Ubuntu 22.04 / macOS 14 / Windows 11
        Python: 3.12.3
        Docker: 27.0
