[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "industrial-agents"
version = "0.1.0"
description = "UNS-native, cybersecurity-aware multi-agent reference architecture for U.S. manufacturing"
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Adris Misra", email = "adris.online@gmail.com" }]
requires-python = ">=3.11"
keywords = [
  "manufacturing", "agentic-ai", "uns", "isa-95", "opc-ua", "sparkplug-b",
  "cmmc", "nist-ai-rmf", "multi-agent", "industrial-iot",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Manufacturing",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
  # Core agent orchestration
  "pyautogen>=0.2",
  "pydantic>=2.5",
  "pydantic-settings>=2.1",
  "aiohttp>=3.9",
  "python-dotenv>=1.0",
  "typer>=0.12",
  "structlog>=24.1",

  # Industrial protocols
  "asyncua>=1.1",
  "paho-mqtt>=2.0",

  # Data / RAG
  "pandas>=2.1",
  "numpy>=1.26",
  "scipy>=1.12",
  "scikit-learn>=1.4",
  "stumpy>=1.12",
  "langchain-core>=0.2",
  "sentence-transformers>=3.0",
  "chromadb>=0.5",
  "unstructured>=0.14",

  # LLM providers
  "anthropic>=0.30",
  "openai>=1.30",
  "boto3>=1.34",
  "ollama>=0.2",

  # Governance / observability
  "opentelemetry-api>=1.24",
  "opentelemetry-sdk>=1.24",
  "opentelemetry-exporter-otlp>=1.24",
  "openlineage-python>=1.18",
  "prometheus-client>=0.20",
  "cryptography>=42.0",

  # Policy / security
  "python-jose>=3.3",

  # UI
  "streamlit>=1.35",
  "plotly>=5.22",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
  "pytest-cov>=5.0",
  "pytest-mock>=3.14",
  "ruff==0.15.16",
  "mypy>=1.10",
  "pre-commit>=3.7",
  "bandit>=1.7",
  "safety>=3.2",
  "mkdocs-material>=9.5",
  "types-boto3",
  "pandas-stubs",
]
docs = [
  "mkdocs-material>=9.5",
  "pymdown-extensions>=10.0",
]
snowflake = [
  "snowflake-connector-python>=3.10",
]
whisper = [
  "openai-whisper>=20231117",
]
influx = [
  "influxdb-client>=1.43",
]
pgvector = [
  "pgvector>=0.2",
  "psycopg2-binary>=2.9",
]

[project.scripts]
industrial-agents = "industrial_agents.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/industrial_agents"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "ANN", "S", "B", "A", "C4", "PT", "SIM", "ARG"]
ignore = [
  "S101",  # use of assert (fine in tests)
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ANN", "S", "ARG"]
"examples/**" = ["ANN", "T201"]
"benchmarks/**" = ["ANN", "S", "ARG"]
"src/industrial_agents/synthetic/**" = ["S311"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
show_error_codes = true
namespace_packages = true
explicit_package_bases = true
mypy_path = "src"

[[tool.mypy.overrides]]
module = [
  "autogen.*",
  "chromadb.*",
  "stumpy.*",
  "unstructured.*",
  "openlineage.*",
  "paho.*",
  "sparkplug_b.*",
  "ollama.*",
  "sentence_transformers.*",
  "langchain_core.*",
  "structlog.*",
  "opentelemetry.*",
  "prometheus_client.*",
  "aiohttp.*",
  "anthropic.*",
  "openai.*",
  "boto3.*",
  "botocore.*",
  "scipy.*",
  "sklearn.*",
  "cryptography.*",
  "typer.*",
  "jose.*",
  "streamlit.*",
  "plotly.*",
]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["asyncua", "asyncua.*"]
ignore_missing_imports = true
follow_imports = "skip"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests", "benchmarks"]
addopts = "--cov=src/industrial_agents --cov-report=term-missing --cov-fail-under=80"
markers = [
  "integration: requires docker-compose stack",
  "eval: LLM-quality regression (nightly only)",
  "slow: takes more than 5 seconds",
]

[tool.coverage.run]
source = ["src/industrial_agents"]
omit = ["*/tests/*", "*/__init__.py"]
