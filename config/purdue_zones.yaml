# Purdue Enterprise Reference Architecture — Zone Definitions
# Used by the UNS Context Broker and Safety/Guardrail Agent to enforce
# cross-zone access policies.
# Ref: IEC 62443 / NIST SP 800-82 Rev 3

zones:
  - level: 5
    name: enterprise
    description: Corporate IT network (ERP, email, business intelligence)
    allowed_protocols: [HTTPS, REST, SOAP]
    can_initiate_to: [4]
    can_receive_from: [4]

  - level: 4
    name: site_business
    description: Site-level business systems (MES, CMMS, historian read)
    allowed_protocols: [HTTPS, REST, OPC-UA-secure]
    can_initiate_to: [3, 5]
    can_receive_from: [3, 5]

  - level: 3
    name: site_operations
    description: Site operations (SCADA, DCS, OPC UA server, historian write)
    allowed_protocols: [OPC-UA, MQTT-TLS, Modbus-TCP]
    can_initiate_to: [2, 4]
    can_receive_from: [2, 4]

  - level: 2
    name: supervisory
    description: Supervisory control (HMI, PLC programming)
    allowed_protocols: [OPC-UA, Modbus-TCP, EtherNet/IP]
    can_initiate_to: [1, 3]
    can_receive_from: [1, 3]

  - level: 1
    name: control
    description: Basic process control (PLC, DCS controllers)
    allowed_protocols: [EtherNet/IP, Modbus-RTU, PROFINET]
    can_initiate_to: [0, 2]
    can_receive_from: [0, 2]

  - level: 0
    name: field
    description: Field devices (sensors, actuators, drives)
    allowed_protocols: [4-20mA, HART, IO-Link, Modbus-RTU]
    can_initiate_to: [1]
    can_receive_from: [1]

# Agent default zone assignments
# Agents operating at a higher zone cannot directly access resources at a lower zone
# without going through the UNS Context Broker mediation.
agent_zones:
  OperationalIntentAgent: 4
  UNSContextBrokerAgent: 3      # keystone — spans zones 3-4 with explicit mediation
  TelemetryHistorianAgent: 3
  AnomalyRootCauseAgent: 3
  TacitKnowledgeCuratorAgent: 4
  SafetyGuardrailAgent: 3
  WorkOrderDispatchAgent: 4
  GovernanceLineageAgent: 4
  HITLSupervisorAgent: 4
  ShopFloorCopilotUI: 4

# Write-action gating: any action that mutates state in zones ≤ 2
# requires Safety/Guardrail approval + HITL if confidence < threshold.
write_gate_zone_threshold: 2
hitl_confidence_threshold: 0.85
